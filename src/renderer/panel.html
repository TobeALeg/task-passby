<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worket</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-row"><h1>Worket</h1>
      <div class="brand-actions"><details class="secondary-menu" id="app-menu"><summary aria-label="更多选项">•••</summary><div class="menu-items"><button id="archive-records" data-filter="ARCHIVED">归档记录</button><button id="service-settings">Worket 服务</button></div></details><button id="close-panel" class="icon-button" aria-label="关闭">×</button></div></div>
      <section class="toolbar">
        <div class="filters" role="tablist" aria-label="工作阶段">
          <button id="tab-recent" class="filter" role="tab" aria-selected="false" aria-controls="sources-panel" tabindex="-1" data-filter="RECENT">最近活动</button>
          <button id="tab-open" class="filter active" role="tab" aria-selected="true" aria-controls="works-panel" data-filter="OPEN">进行中</button>
          <button id="tab-completed" class="filter" role="tab" aria-selected="false" aria-controls="works-panel" tabindex="-1" data-filter="COMPLETED">已完成</button>
          <button id="tab-definitions" class="filter" role="tab" aria-selected="false" aria-controls="definitions-panel" tabindex="-1" data-filter="DEFINITIONS">已沉淀</button>
        </div>
      </section>
    </header>

    <main>
      <div id="notice" class="notice" role="status" hidden></div>
      <section id="definitions-panel" role="tabpanel" aria-labelledby="tab-definitions" hidden></section>
      <section id="sources-panel" class="recording-sources" role="tabpanel" aria-labelledby="tab-recent" hidden>
        <div class="source-actions"><button id="record-history" class="secondary">历史聊天</button></div>
        <div id="source-error" class="notice" role="alert" hidden></div>
        <div id="recent-sources"><p class="source-empty">正在查找活动聊天…</p></div>
      </section>
      <section id="works-panel" role="tabpanel" aria-labelledby="tab-open">
        <div id="list-toolbar" class="list-toolbar"><h2 id="list-title">进行中</h2><button id="distill-selected" disabled>沉淀所选</button></div>
        <section id="work-list" class="work-list"></section>
        <section id="work-detail" class="work-detail" hidden></section>
      </section>
    </main>

    <dialog id="history-dialog" aria-labelledby="history-title">
      <div class="dialog-card">
        <div class="source-heading"><h2 id="history-title">历史聊天</h2><button id="history-close" class="icon-button" aria-label="关闭历史聊天">×</button></div>
        <label class="field">执行者<select id="history-executor"></select></label>
        <label class="field">搜索已加载聊天<input id="history-search" type="search" placeholder="聊天标题或项目" /></label>
        <div id="history-error" class="notice" role="alert" hidden></div>
        <div id="history-sources" class="history-sources"></div>
        <div class="dialog-actions"><button id="history-retry" class="secondary">刷新列表</button><button id="history-more" class="secondary" hidden>加载更多</button></div>
      </div>
    </dialog>

    <dialog id="split-dialog" aria-labelledby="split-title">
      <form method="dialog" class="dialog-card">
        <div class="dialog-heading"><h2 id="split-title">从消息新建</h2></div>
        <p class="consent">所选消息起另建工作，原工作停止同步并保留记录。</p>
        <p id="split-upload-notice" class="notice" hidden></p>
        <label class="field">起始用户消息<select id="split-point"></select></label>
        <div class="dialog-actions">
          <button value="cancel" class="secondary">取消</button>
          <button id="confirm-split" value="default" class="primary">创建新工作</button>
        </div>
      </form>
    </dialog>

    <dialog id="cancel-recording-dialog" aria-labelledby="cancel-title">
      <form method="dialog" class="dialog-card danger-card">
        <div class="dialog-heading"><h2 id="cancel-title">取消记录这项工作？</h2></div>
        <p>停止同步与上传，并永久清除本地记录及来源证据。原应用的对话、文件和已确认定义保留。</p>
        <details class="policy-details"><summary>数据处理详情</summary><p>未保存候选失效，含历史正文的迁移备份会移除。已上传样本需在“Worket 服务 → 改进数据”单独删除。</p></details>
        <p id="cancel-recording-error" class="notice" role="alert" hidden></p>
        <label class="field">输入“取消记录”<input id="cancel-recording-confirmation" autocomplete="off" /></label>
        <div class="dialog-actions"><button value="cancel" class="secondary">取消</button><button id="confirm-cancel-recording" value="default" class="danger">取消记录</button></div>
      </form>
    </dialog>

    <script type="module" src="panel.js"></script>
  </body>
</html>
