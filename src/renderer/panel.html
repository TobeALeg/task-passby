<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worket</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="topbar">
      <div><span class="eyebrow">WORKPET</span><h1>我的工作</h1></div>
      <button id="close-panel" class="icon-button" aria-label="关闭">×</button>
    </header>

    <main>
      <section class="toolbar">
        <div class="filters" role="tablist" aria-label="工作阶段">
          <button id="tab-recent" class="filter" role="tab" aria-selected="false" aria-controls="sources-panel" tabindex="-1" data-filter="RECENT">最近活动</button>
          <button id="tab-open" class="filter active" role="tab" aria-selected="true" aria-controls="works-panel" data-filter="OPEN">进行中</button>
          <button id="tab-completed" class="filter" role="tab" aria-selected="false" aria-controls="works-panel" tabindex="-1" data-filter="COMPLETED">已完成</button>
          <button id="tab-archived" class="filter" role="tab" aria-selected="false" aria-controls="works-panel" tabindex="-1" data-filter="ARCHIVED">已归档</button>
        </div>
      </section>
      <section id="sources-panel" class="recording-sources" role="tabpanel" aria-labelledby="tab-recent" hidden>
        <div class="source-actions"><button id="record-history" class="secondary">记录沉睡工作</button></div>
        <div id="source-error" class="notice" role="alert" hidden></div>
        <div id="recent-sources"><p class="source-empty">正在查找活动聊天…</p></div>
      </section>
      <section id="works-panel" role="tabpanel" aria-labelledby="tab-open">
        <div id="notice" class="notice" hidden></div>
        <section id="work-list" class="work-list"></section>
        <section id="work-detail" class="work-detail" hidden></section>
      </section>
    </main>

    <dialog id="history-dialog" aria-labelledby="history-title">
      <div class="dialog-card">
        <div class="source-heading"><h2 id="history-title">记录沉睡工作</h2><button id="history-close" class="icon-button" aria-label="关闭历史聊天">×</button></div>
        <label class="field">搜索已加载的聊天<input id="history-search" type="search" placeholder="聊天标题或项目" /></label>
        <div id="history-error" class="notice" role="alert" hidden></div>
        <div id="history-sources" class="history-sources"></div>
        <div class="dialog-actions"><button id="history-retry" class="secondary">刷新列表</button><button id="history-more" class="secondary" hidden>加载更早的聊天</button></div>
      </div>
    </dialog>

    <dialog id="split-dialog">
      <form method="dialog" class="dialog-card">
        <div class="dialog-heading"><span class="eyebrow">新工作</span><h2>从哪条消息开始？</h2></div>
        <p>原工作记录会保留；所选消息及其后的内容将成为新的 WorkInstance。</p>
        <label class="field">起始用户消息<select id="split-point"></select></label>
        <div class="dialog-actions">
          <button value="cancel" class="secondary">取消</button>
          <button id="confirm-split" value="default" class="primary">创建新工作</button>
        </div>
      </form>
    </dialog>

    <dialog id="delete-dialog">
      <form method="dialog" class="dialog-card danger-card">
        <div class="dialog-heading"><span class="eyebrow">永久删除</span><h2>这份本地记录将无法恢复</h2></div>
        <p>原始文件、Codex 与 WorkBuddy 对话不会被删除。请输入“永久删除”继续。</p>
        <label class="field">确认文字<input id="delete-confirmation" autocomplete="off" /></label>
        <div class="dialog-actions"><button value="cancel" class="secondary">取消</button><button id="confirm-delete" value="default" class="danger">永久删除</button></div>
      </form>
    </dialog>

    <script type="module" src="panel.js"></script>
  </body>
</html>
